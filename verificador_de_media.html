<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificador de Média</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 28px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
    text-align: center;
  }
  h1 { margin: 0 0 8px; color: #172554; }
  p { color: #64748b; margin-bottom: 24px; }
  label { display:block; text-align:left; font-weight:bold; margin-bottom:8px; }
  input {
    width: 100%;
    padding: 14px;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    font-size: 18px;
    margin-bottom: 14px;
  }
  button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: #2563eb;
    color: white;
  }
  button:active { transform: scale(.99); }
  #resultado {
    margin-top: 20px;
    padding: 16px;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
    min-height: 24px;
  }
  .aprovado { background:#dcfce7; color:#166534; }
  .recuperacao { background:#fef3c7; color:#92400e; }
  .reprovado { background:#fee2e2; color:#991b1b; }
  .erro { background:#e2e8f0; color:#334155; }
  .rodape { margin-top:18px; font-size:12px; color:#94a3b8; }
</style>
</head>
<body>
  <main class="card">
    <h1>📚 Verificador de Média</h1>
    <p>Descubra sua situação acadêmica</p>

    <label for="media">Digite sua média:</label>
    <input id="media" type="text" inputmode="decimal" placeholder="Ex.: 6,5" autocomplete="off">

    <button onclick="verificar()">VERIFICAR</button>

    <div id="resultado"></div>

    <div class="rodape">7 ou mais: aprovado • 5 a 6,9: recuperação • abaixo de 5: reprovado</div>
  </main>

<script>
function verificar() {
  const campo = document.getElementById("media");
  const resultado = document.getElementById("resultado");
  const texto = campo.value.trim().replace(",", ".");
  const media = Number(texto);

  resultado.className = "";

  if (texto === "" || Number.isNaN(media)) {
    resultado.textContent = "Digite uma média válida.";
    resultado.className = "erro";
    return;
  }

  if (media < 0 || media > 10) {
    resultado.textContent = "A média deve estar entre 0 e 10.";
    resultado.className = "erro";
  } else if (media >= 7) {
    resultado.textContent = "🟢 Aprovado!";
    resultado.className = "aprovado";
  } else if (media >= 5) {
    resultado.textContent = "🟡 Recuperação";
    resultado.className = "recuperacao";
  } else {
    resultado.textContent = "🔴 Reprovado";
    resultado.className = "reprovado";
  }
}

document.getElementById("media").addEventListener("keydown", function(e) {
  if (e.key === "Enter") verificar();
});
</script>
</body>
</html>
