<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Colete as Moedas</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #17202a;
        color: white;
        text-align: center;
    }

    h1 {
        margin: 20px 0 8px;
    }

    #placar {
        font-size: 22px;
        margin-bottom: 12px;
    }

    #jogo {
        width: 92vw;
        max-width: 500px;
        height: 65vh;
        max-height: 600px;
        min-height: 400px;
        margin: auto;
        background: #2ecc71;
        border: 5px solid white;
        border-radius: 15px;
        position: relative;
        overflow: hidden;
        touch-action: manipulation;
    }

    #moeda {
        position: absolute;
        width: 65px;
        height: 65px;
        border-radius: 50%;
        background: gold;
        border: 4px solid #d4ac0d;
        color: #7d6608;
        font-size: 34px;
        display: none;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        user-select: none;
    }

    button {
        margin: 15px;
        padding: 14px 28px;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    #mensagem {
        font-size: 18px;
        min-height: 24px;
    }
</style>
</head>

<body>

<h1>🎮 Colete as Moedas</h1>

<div id="placar">
    Pontos: <span id="pontos">0</span> |
    Tempo: <span id="tempo">30</span>s
</div>

<div id="jogo">
    <div id="moeda">🪙</div>
</div>

<button onclick="iniciarJogo()">COMEÇAR</button>

<div id="mensagem">Clique em COMEÇAR!</div>

<script>
let pontos = 0;
let tempo = 30;
let jogoAtivo = false;
let intervalo;

const jogo = document.getElementById("jogo");
const moeda = document.getElementById("moeda");
const pontosTexto = document.getElementById("pontos");
const tempoTexto = document.getElementById("tempo");
const mensagem = document.getElementById("mensagem");

function iniciarJogo() {
    pontos = 0;
    tempo = 30;
    jogoAtivo = true;

    pontosTexto.textContent = pontos;
    tempoTexto.textContent = tempo;
    mensagem.textContent = "Pegue as moedas! 🪙";

    moeda.style.display = "flex";
    moverMoeda();

    clearInterval(intervalo);

    intervalo = setInterval(function() {
        tempo--;
        tempoTexto.textContent = tempo;

        if (tempo <= 0) {
            clearInterval(intervalo);
            jogoAtivo = false;
            moeda.style.display = "none";
            mensagem.textContent = "Fim de jogo! Você fez " + pontos + " pontos. 🎉";
        }
    }, 1000);
}

function moverMoeda() {
    const limiteX = jogo.clientWidth - moeda.offsetWidth;
    const limiteY = jogo.clientHeight - moeda.offsetHeight;

    const x = Math.random() * limiteX;
    const y = Math.random() * limiteY;

    moeda.style.left = x + "px";
    moeda.style.top = y + "px";
}

moeda.addEventListener("click", function() {
    if (!jogoAtivo) {
        return;
    }

    pontos++;
    pontosTexto.textContent = pontos;
    moverMoeda();
});
</script>

</body>
</html>
