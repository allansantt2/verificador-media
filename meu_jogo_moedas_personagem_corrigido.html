<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎮 Colete as Moedas</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Arial,sans-serif;
  background:#111b29;color:white;text-align:center;overflow-x:hidden
}
h1{font-size:clamp(28px,7vw,44px);margin:22px 8px 4px}
.subtitle{font-size:clamp(17px,4.5vw,24px);margin:0 12px 12px}
.hud{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;
  font-size:clamp(19px,5vw,28px);margin-bottom:12px}
.hud b{color:#ffd21c}
.game{
  position:relative;width:min(94vw,900px);height:min(58vw,520px);min-height:300px;
  margin:auto;overflow:hidden;border:7px solid white;border-radius:25px;
  background:
    radial-gradient(circle at 12% 20%,#77b82a 0 3px,transparent 4px),
    radial-gradient(circle at 82% 24%,#9bc83a 0 3px,transparent 4px),
    radial-gradient(circle at 65% 76%,#6ba925 0 4px,transparent 5px),
    linear-gradient(#67ad25,#8bc83b 55%,#65ad27)
}
.grass{position:absolute;inset:0;opacity:.5;
  background-image:
  radial-gradient(ellipse at 20% 35%,rgba(255,255,255,.28) 0 2px,transparent 3px),
  radial-gradient(ellipse at 70% 15%,rgba(255,255,255,.25) 0 2px,transparent 3px)
}
.path{
  position:absolute;left:0;width:100%;top:50%;height:112px;transform:translateY(-50%);
  display:flex;align-items:stretch;overflow:hidden
}
.stone{
  flex:0 0 68px;border:2px solid #77786d;margin:1px;border-radius:10px;
  background:linear-gradient(145deg,#aaa99a,#77786c);
  box-shadow:inset 4px 4px 0 rgba(255,255,255,.22),inset -5px -5px 0 rgba(0,0,0,.13)
}

/* Personagem: desenho próprio, olhando para a DIREITA, em direção às moedas */
.player{
  position:absolute;z-index:6;top:50%;left:22px;width:82px;height:106px;
  transform:translateY(-58%);transition:left .06s linear;
  filter:drop-shadow(2px 4px 2px rgba(0,0,0,.4))
}
.player svg{width:100%;height:100%;overflow:visible}
.player.running{animation:bob .18s infinite alternate}
@keyframes bob{
  from{transform:translateY(-58%) rotate(-2deg)}
  to{transform:translateY(-63%) rotate(2deg)}
}

.coin{
  position:absolute;top:50%;transform:translate(-50%,-50%);
  width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle,#ffe77a 0 22%,#ffc400 23% 62%,#e09a00 63% 100%);
  border:4px solid #fff1a8;box-shadow:0 0 14px #ffd21c,0 3px 4px rgba(0,0,0,.35);
  z-index:4;font-size:30px;line-height:50px;color:#fff;transition:transform .15s,opacity .2s
}
.coin.collected{opacity:0;transform:translate(-50%,-50%) scale(1.8)}

.finish{
  position:absolute;right:18px;top:50%;transform:translateY(-105%);
  z-index:5;font-size:58px
}
.finish-gap{
  position:absolute;z-index:3;top:50%;right:90px;width:75px;height:8px;
  transform:translateY(-50%);background:transparent
}
.spark{position:absolute;z-index:8;font-size:28px;pointer-events:none;animation:pop .55s forwards}
@keyframes pop{0%{opacity:1;transform:translateY(0) scale(.5)}
100%{opacity:0;transform:translateY(-45px) scale(1.4)}}

button{
  margin:22px 0 8px;padding:18px 42px;border:0;border-radius:18px;
  font-size:22px;font-weight:800;cursor:pointer;background:#fff;color:#111;
  box-shadow:0 5px 0 #bbb
}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #999}
.message{font-size:20px;margin:4px 10px 20px;min-height:28px}
.instructions{font-size:16px;opacity:.85;margin:8px 15px 24px}

@media(max-width:520px){
  .game{height:420px;min-height:420px}
  .path{height:105px}
  .stone{flex-basis:58px}
  .coin{width:48px;height:48px;font-size:25px;line-height:40px}
  .player{width:68px;height:92px}
  .finish{font-size:48px;right:12px}
}
</style>
</head>
<body>
<h1>🎮 Colete as Moedas</h1>
<div class="subtitle">Ajude o personagem a coletar todas as moedas!</div>

<div class="hud">
  <span>Pontos: <b id="score">0</b></span>
  <span>Tempo: <b id="time">30</b>s</span>
  <span>🪙 <b id="count">0</b>/<b id="total">8</b></span>
</div>

<div class="game" id="game">
  <div class="grass"></div>
  <div class="path" id="path"></div>

  <!-- Bandeira separada da última moeda por um espaço -->
  <div class="finish">🏁</div>

  <!-- Personagem virado para a direita -->
  <div class="player" id="player" aria-label="personagem correndo para a direita">
    <svg viewBox="0 0 100 125" role="img">
      <!-- cabelo -->
      <path d="M43 20 Q48 5 67 10 Q82 14 78 31 L67 29 L60 22 L52 31 Z" fill="#161616"/>
      <!-- rosto -->
      <circle cx="61" cy="35" r="18" fill="#f4b27a"/>
      <!-- nariz/olho, indicando que olha para a direita -->
      <circle cx="68" cy="31" r="2.8" fill="#111"/>
      <path d="M75 36 q7 2 0 5" fill="none" stroke="#9b5439" stroke-width="2"/>
      <!-- camisa -->
      <path d="M45 52 Q61 45 74 56 L70 79 L48 78 Z" fill="#e63b2e"/>
      <!-- braço da frente -->
      <path d="M70 56 Q84 61 88 71" fill="none" stroke="#f4b27a" stroke-width="9" stroke-linecap="round"/>
      <!-- braço de trás -->
      <path d="M48 58 Q37 67 34 76" fill="none" stroke="#f4b27a" stroke-width="9" stroke-linecap="round"/>
      <!-- perna da frente -->
      <path d="M63 77 Q77 89 87 103" fill="none" stroke="#243b63" stroke-width="11" stroke-linecap="round"/>
      <!-- perna de trás -->
      <path d="M53 78 Q42 91 29 101" fill="none" stroke="#243b63" stroke-width="11" stroke-linecap="round"/>
      <!-- tênis -->
      <path d="M82 99 Q94 101 96 108 Q87 113 76 106 Z" fill="#f2f2f2"/>
      <path d="M25 98 Q14 99 10 106 Q19 112 32 105 Z" fill="#f2f2f2"/>
    </svg>
  </div>
</div>

<button id="start">COMEÇAR</button>
<div class="message" id="message">Clique em COMEÇAR para iniciar!</div>
<div class="instructions">O personagem caminha sozinho, pega as moedas e chega até a bandeira.</div>

<script>
const game=document.getElementById('game');
const player=document.getElementById('player');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const countEl=document.getElementById('count');
const totalEl=document.getElementById('total');
const startBtn=document.getElementById('start');
const msg=document.getElementById('message');

for(let i=0;i<16;i++){
  const s=document.createElement('div');
  s.className='stone';
  document.getElementById('path').appendChild(s);
}

const coinPositions=[22,31,40,49,58,67,76,84];
let coins=[],running=false,score=0,collected=0,time=30,startTime,raf,timer;

function makeCoins(){
  document.querySelectorAll('.coin').forEach(c=>c.remove());
  coins=[];
  const w=game.clientWidth;
  coinPositions.forEach(p=>{
    const c=document.createElement('div');
    c.className='coin';
    c.textContent='★';
    c.style.left=p+'%';
    game.appendChild(c);
    coins.push({el:c,x:w*p/100,collected:false});
  });
  totalEl.textContent=coins.length;
}

function reset(){
  cancelAnimationFrame(raf);clearInterval(timer);
  score=0;collected=0;time=30;running=false;
  scoreEl.textContent=0;countEl.textContent=0;timeEl.textContent=30;
  player.style.left='22px';player.classList.remove('running');
  msg.textContent='Clique em COMEÇAR para iniciar!';
  startBtn.textContent='COMEÇAR';
  makeCoins();
}

function sparkle(x){
  const e=document.createElement('div');
  e.className='spark';e.textContent='✨';
  e.style.left=x+'px';
  e.style.top=(game.clientHeight/2-45)+'px';
  game.appendChild(e);
  setTimeout(()=>e.remove(),600);
}

function finish(text){
  running=false;cancelAnimationFrame(raf);clearInterval(timer);
  player.classList.remove('running');
  msg.textContent=text;
  startBtn.textContent='JOGAR NOVAMENTE';
}

function loop(now){
  if(!running)return;
  const elapsed=(now-startTime)/1000;
  time=Math.max(0,30-Math.floor(elapsed));
  timeEl.textContent=time;

  /* O personagem para antes da bandeira, deixando a bandeira afastada das moedas. */
  const duration=27000;
  const progress=Math.min(1,elapsed*1000/duration);
  const maxX=game.clientWidth-125;
  const x=22+(maxX-22)*progress;
  player.style.left=x+'px';

  coins.forEach(c=>{
    if(!c.collected && Math.abs((x+40)-c.x)<43){
      c.collected=true;
      c.el.classList.add('collected');
      score+=10;collected++;
      scoreEl.textContent=score;
      countEl.textContent=collected;
      sparkle(c.x);
    }
  });

  if(progress>=1){
    finish(collected===coins.length
      ? '🏆 Parabéns! Você coletou todas as moedas e chegou ao final!'
      : `🏁 Fim do caminho! Você coletou ${collected} moeda(s).`);
    return;
  }
  if(time<=0){
    finish(`⏰ Tempo esgotado! Você fez ${score} pontos.`);
    return;
  }
  raf=requestAnimationFrame(loop);
}

function start(){
  reset();
  running=true;
  startBtn.textContent='JOGANDO...';
  player.classList.add('running');
  msg.textContent='🏃 O personagem está caminhando para as moedas!';
  startTime=performance.now();
  raf=requestAnimationFrame(loop);
}

startBtn.addEventListener('click',()=>{if(!running)start()});
window.addEventListener('resize',()=>{if(!running)makeCoins()});
reset();
</script>
</body>
</html>
