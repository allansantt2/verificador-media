<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Colete as Moedas</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #17202a;
    color: white;
    text-align: center;
}

h1 {
    margin: 25px 0 8px;
    font-size: 32px;
}

#placar {
    font-size: 24px;
    margin-bottom: 20px;
}

#jogo {
    position: relative;
    width: calc(100% - 40px);
    max-width: 650px;
    height: 65vh;
    min-height: 420px;
    margin: auto;
    background: #2ecc71;
    border: 7px solid white;
    border-radius: 22px;
    overflow: hidden;
}

#moeda {
    position: absolute;
    display: none;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #ffd700;
    border: 4px solid #f1c40f;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    font-size: 27px;
    line-height: 40px;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
}

#comecar {
    margin-top: 22px;
    padding: 18px 42px;
    border: 0;
    border-radius: 15px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

#mensagem {
    font-size: 20px;
    margin: 20px;
}
</style>
</head>

<body>

<h1>🎮 Colete as Moedas</h1>

<div id="placar">Pontos: 0 | Tempo: 30s</div>

<div id="jogo">
    <div id="moeda">🪙</div>
</div>

<button id="comecar">COMEÇAR</button>

<div id="mensagem">Clique em COMEÇAR!</div>

<script>
let pontos = 0;
let tempo = 30;
let intervalo;
let jogando = false;

const jogo = document.getElementById("jogo");
const moeda = document.getElementById("moeda");
const placar = document.getElementById("placar");
const comecar = document.getElementById("comecar");
const mensagem = document.getElementById("mensagem");

function atualizarPlacar() {
    placar.textContent = "Pontos: " + pontos + " | Tempo: " + tempo + "s";
}

function colocarMoeda() {
    const maxX = jogo.clientWidth - moeda.offsetWidth;
    const maxY = jogo.clientHeight - moeda.offsetHeight;

    const x = Math.floor(Math.random() * maxX);
    const y = Math.floor(Math.random() * maxY);

    moeda.style.left = x + "px";
    moeda.style.top = y + "px";
    moeda.style.display = "block";
}

function iniciarJogo() {
    pontos = 0;
    tempo = 30;
    jogando = true;

    atualizarPlacar();
    mensagem.textContent = "Pegue as moedas! 🪙";
    comecar.textContent = "JOGANDO...";
    comecar.disabled = true;

    colocarMoeda();

    clearInterval(intervalo);
    intervalo = setInterval(function() {
        tempo--;
        atualizarPlacar();

        if (tempo <= 0) {
            clearInterval(intervalo);
            jogando = false;
            moeda.style.display = "none";
            comecar.disabled = false;
            comecar.textContent = "JOGAR NOVAMENTE";
            mensagem.textContent = "Fim de jogo! Você fez " + pontos + " ponto(s)! 🏆";
        }
    }, 1000);
}

moeda.addEventListener("click", function() {
    if (!jogando) return;

    pontos++;
    atualizarPlacar();
    colocarMoeda();
});

comecar.addEventListener("click", iniciarJogo);
</script>

</body>
</html>
